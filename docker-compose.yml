version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: geospatial-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./geospatial.db
      - UPLOAD_DIR=/app/uploads
      - MAX_UPLOAD_SIZE_MB=50
      - LOG_LEVEL=INFO
      - DEBUG=False
    volumes:
      # Mount uploads directory to persist files
      - ./uploads:/app/uploads
      # Mount database to persist data
      - ./geospatial.db:/app/geospatial.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
